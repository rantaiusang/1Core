<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - 1 Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* STANDARD STYLE */
        :root { --gold: #c5a059; --dark: #0f0c15; --card: #161216; --gray: #a0a0a0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--white); }
        
        /* HEADER */
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 12, 21, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-family: 'Playfair Display'; font-size: 1.8rem; color: var(--white); text-decoration: none; } 
        .logo span { color: var(--gold); }
        .nav-links { display: flex; gap: 35px; align-items: center; }
        .nav-links a { color: var(--gray); font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; text-decoration: none; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .btn-nav { padding: 10px 25px; background: var(--gold); color: #000; border-radius: 30px; font-weight: 600; }

        /* PORTFOLIO GRID */
        .page-hero { height: 50vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 80px; }
        .page-hero h1 { font-family: 'Playfair Display'; font-size: 3.5rem; color: var(--gold); }
        
        .portfolio-section { padding: 80px 8%; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .project-item { position: relative; height: 450px; border-radius: 10px; overflow: hidden; cursor: pointer; }
        .project-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; filter: brightness(0.7); }
        .project-item:hover img { transform: scale(1.1); filter: brightness(0.4); }
        .project-info { position: absolute; bottom: 30px; left: 30px; right: 30px; color: #fff; opacity: 0; transform: translateY(20px); transition: 0.4s; }
        .project-item:hover .project-info { opacity: 1; transform: translateY(0); }
        .project-info h3 { font-family: 'Playfair Display'; font-size: 1.8rem; color: var(--gold); }
        
        /* FOOTER */
        footer { background: #0a080c; padding: 30px 8%; text-align: center; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">1 <span>Core</span></a>
        <nav class="nav-links">
            <!-- MENU DIPERBARUI: Tambahan Beranda & Galeri -->
            <a href="index.html">Beranda</a>
            <a href="about.html">Tentang</a>
            <a href="services.html">Layanan</a>
            <a href="portfolio.html" class="active">Portofolio</a>
            <a href="gallery.html">Galeri</a>
            <a href="contact.html" class="btn-nav">Hubungi Kami</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="page-hero"><h1>Portofolio Kami</h1></section>

    <!-- CONTENT -->
    <section class="portfolio-section">
        <div class="portfolio-grid">
            <div class="project-item">
                <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=800" alt="Proyek 1">
                <div class="project-info">
                    <span style="text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">Residensial</span>
                    <h3>Rumah Modern</h3>
                </div>
            </div>
            <div class="project-item">
                <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=800" alt="Proyek 2">
                <div class="project-info">
                    <span style="text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">Komersial</span>
                    <h3>Kopi Kolektif</h3>
                </div>
            </div>
            <div class="project-item">
                <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=800" alt="Proyek 3">
                <div class="project-info">
                    <span style="text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">Residensial</span>
                    <h3>Kamar Tidur Tenang</h3>
                </div>
            </div>
        </div>
    </section>

    <footer><p>&copy; 2024 1 Core Interior Design Studio.</p></footer>
</body>
</html>
