<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - 1 Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL STYLES --- */
        :root { --gold: #c5a059; --dark: #0f0c15; --card: #161216; --gray: #a0a0a0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--white); }

        /* HEADER */
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 12, 21, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .logo { font-family: 'Playfair Display'; font-size: 1.8rem; color: var(--white); text-decoration: none; } 
        .logo span { color: var(--gold); }

        /* NAV DESKTOP */
        .nav-links { display: flex; gap: 35px; align-items: center; }
        .nav-links a { color: var(--gray); font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; text-decoration: none; position: relative; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .btn-nav { padding: 10px 25px; background: var(--gold); color: #000; border-radius: 30px; font-weight: 600; }

        /* NAV MOBILE (HAMBURGER) */
        .hamburger { display: none; font-size: 1.5rem; color: var(--white); cursor: pointer; z-index: 150; }
        .mobile-menu { display: none; position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: #0a080c; flex-direction: column; padding: 80px 30px 30px; gap: 25px; transition: 0.4s ease; z-index: 140; border-left: 1px solid rgba(255,255,255,0.1); }
        .mobile-menu a { color: var(--white); text-decoration: none; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .mobile-menu a.active { color: var(--gold); }
        .mobile-menu.open { right: 0; }
        .overlay-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 130; }

        /* PAGE HERO */
        .page-hero { height: 35vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 80px; background: linear-gradient(to bottom, #1a161d, var(--dark)); }
        .page-hero h1 { font-family: 'Playfair Display'; font-size: 3rem; color: var(--gold); padding: 0 10px; }

        /* GALLERY GRID */
        .gallery-section { padding: 50px 4%; min-height: 60vh; }
        /* Grid responsive: 1 kolom di mobile, auto di desktop */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

        /* GALLERY ITEM */
        .gallery-item { position: relative; height: 300px; /* Tinggi sedikit dikurangi agar pas mobile */ border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transform: translateY(20px); transition: 0.5s; }
        .gallery-item.loaded { opacity: 1; transform: translateY(0); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; filter: brightness(0.8); }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.5); }
        
        /* Overlay Info - Mobile Friendly */
        .item-info { position: absolute; bottom: 0; left: 0; right: 0; color: #fff; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); transform: translateY(20px); opacity: 0; transition: 0.4s; }
        /* Di mobile, info selalu terlihat sedikit agar user tahu itu bisa diklik */
        .gallery-item:hover .item-info, .gallery-item:active .item-info { opacity: 1; transform: translateY(0); }
        .item-category { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .item-title { font-family: 'Playfair Display'; font-size: 1.3rem; margin-top: 5px; }

        /* SKELETON LOADER */
        .skeleton { background: linear-gradient(90deg, var(--card) 25%, #1f1a25 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        .skeleton-img { width: 100%; height: 100%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* MODAL LIGHTBOX */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
        .modal img { max-width: 100%; max-height: 90%; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2.5rem; cursor: pointer; transition: 0.3s; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .modal-close:hover { color: var(--gold); background: rgba(255,255,255,0.2); }

        /* FOOTER */
        footer { background: #0a080c; padding: 30px 5%; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { color: #555; font-size: 0.8rem; }

        /* --- RESPONSIVE TABLET & MOBILE --- */
        @media (max-width: 768px) {
            header { padding: 15px 4%; }
            .logo { font-size: 1.5rem; }
            .nav-links { display: none; } /* Sembunyikan menu desktop */
            .hamburger { display: block; } /* Tampilkan hamburger */
            .mobile-menu { display: flex; } /* Aktifkan struktur mobile menu */
            .page-hero h1 { font-size: 2.2rem; }
            .gallery-section { padding: 40px 4%; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">1 <span>Core</span></a>
        
        <!-- Nav Desktop (Hidden on Mobile) -->
        <nav class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="about.html">Tentang</a>
            <a href="services.html">Layanan</a>
            <a href="portfolio.html">Portofolio</a>
            <a href="gallery.html" class="active">Galeri</a>
            <a href="contact.html" class="btn-nav">Hubungi Kami</a>
        </nav>

        <!-- Hamburger Icon (Visible on Mobile) -->
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars" id="menuIcon"></i>
        </div>
    </header>

    <!-- Mobile Menu Sidebar -->
    <div class="overlay-bg" id="overlayBg" onclick="toggleMenu()"></div>
    <nav class="mobile-menu" id="mobileMenu">
        <a href="index.html">Beranda</a>
        <a href="about.html">Tentang</a>
        <a href="services.html">Layanan</a>
        <a href="portfolio.html">Portofolio</a>
        <a href="gallery.html" class="active">Galeri</a>
        <a href="contact.html" style="margin-top: 20px; background: var(--gold); color: #000; text-align: center; border-radius: 30px; padding: 15px;">Hubungi Kami</a>
    </nav>

    <!-- HERO -->
    <section class="page-hero">
        <h1>Galeri Proyek</h1>
    </section>

    <!-- GALLERY SECTION -->
    <section class="gallery-section">
        <div class="gallery-grid" id="galleryContainer">
            <div class="gallery-item skeleton"><div class="skeleton-img"></div></div>
            <div class="gallery-item skeleton"><div class="skeleton-img"></div></div>
        </div>
    </section>

    <!-- MODAL LIGHTBOX -->
    <div class="modal" id="imgModal" onclick="this.style.display='none'">
        <span class="modal-close">&times;</span>
        <img src="" id="modalImg">
    </div>

    <!-- FOOTER -->
    <footer><p>&copy; 2024 1 Core Interior Design Studio.</p></footer>

    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- MOBILE MENU FUNCTION ---
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const overlay = document.getElementById('overlayBg');
            const icon = document.getElementById('menuIcon');
            
            menu.classList.toggle('open');
            overlay.style.display = menu.classList.contains('open') ? 'block' : 'none';
            
            // Ganti ikon bars <-> times (X)
            if (menu.classList.contains('open')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        }

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://dikapquhusbwjccbqcsb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpa2FwcXVodXNid2pjY2JxY3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNjQ1NTQsImV4cCI6MjA4NDc0MDU1NH0.X278oHDF0be7oa25484eliSukSYAYvDbJyU6ysz83zA';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LOAD GALLERY ---
        async function loadGallery() {
            const container = document.getElementById('galleryContainer');
            
            try {
                let { data, error } = await sb
                    .from('1_core_gallery')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p style="color:var(--gray); text-align:center; grid-column: 1/-1;">Tidak ada proyek ditemukan.</p>';
                    return;
                }

                data.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    
                    div.innerHTML = `
                        <img src="${item.image_url}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Error'">
                        <div class="item-info">
                            <span class="item-category">${item.category}</span>
                            <h3 class="item-title">${item.title}</h3>
                        </div>
                    `;

                    div.onclick = () => openModal(item.image_url);

                    container.appendChild(div);

                    setTimeout(() => {
                        div.classList.add('loaded');
                    }, 100 * index);
                });

            } catch (err) {
                console.error('Error loading gallery:', err.message);
                container.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Gagal memuat data.</p>`;
            }
        }

        // --- MODAL FUNCTION ---
        function openModal(src) {
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = src;
        }

        window.onload = loadGallery;
    </script>
</body>
</html>
