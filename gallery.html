<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - 1 Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL STYLES --- */
        :root { --gold: #c5a059; --dark: #0f0c15; --card: #161216; --gray: #a0a0a0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--white); }

        /* HEADER */
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 12, 21, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-family: 'Playfair Display'; font-size: 1.8rem; color: var(--white); } .logo span { color: var(--gold); }
        .nav-links { display: flex; gap: 35px; align-items: center; }
        .nav-links a { color: var(--gray); font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .btn-nav { padding: 10px 25px; background: var(--gold); color: #000; border-radius: 30px; font-weight: 600; }

        /* PAGE HERO */
        .page-hero { height: 40vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 80px; background: linear-gradient(to bottom, #1a161d, var(--dark)); }
        .page-hero h1 { font-family: 'Playfair Display'; font-size: 3.5rem; color: var(--gold); }

        /* GALLERY GRID */
        .gallery-section { padding: 80px 8%; min-height: 60vh; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }

        /* GALLERY ITEM */
        .gallery-item { position: relative; height: 350px; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transform: translateY(20px); transition: 0.5s; }
        .gallery-item.loaded { opacity: 1; transform: translateY(0); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; filter: brightness(0.8); }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.5); }
        
        /* Overlay Info */
        .item-info { position: absolute; bottom: 20px; left: 20px; right: 20px; color: #fff; transform: translateY(30px); opacity: 0; transition: 0.4s; }
        .gallery-item:hover .item-info { opacity: 1; transform: translateY(0); }
        .item-category { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .item-title { font-family: 'Playfair Display'; font-size: 1.5rem; margin-top: 5px; }

        /* SKELETON LOADER */
        .skeleton { background: linear-gradient(90deg, var(--card) 25%, #1f1a25 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        .skeleton-img { width: 100%; height: 100%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* MODAL LIGHTBOX */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 30px; right: 40px; color: #fff; font-size: 2rem; cursor: pointer; transition: 0.3s; }
        .modal-close:hover { color: var(--gold); }

        /* FOOTER */
        footer { background: #0a080c; padding: 30px 8%; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">1 <span>Core</span></a>
        <nav class="nav-links">
            <!-- MENU DIPERBARUI: Tambahan Beranda & Bahasa Indonesia -->
            <a href="index.html">Beranda</a>
            <a href="about.html">Tentang</a>
            <a href="services.html">Layanan</a>
            <a href="portfolio.html">Portofolio</a>
            <a href="gallery.html" class="active">Galeri</a>
            <a href="contact.html" class="btn-nav">Hubungi Kami</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="page-hero">
        <h1>Galeri Proyek</h1>
    </section>

    <!-- GALLERY SECTION -->
    <section class="gallery-section">
        <div class="gallery-grid" id="galleryContainer">
            <!-- Skeleton Loaders akan tampil di sini awalnya -->
            <div class="gallery-item skeleton"><div class="skeleton-img"></div></div>
            <div class="gallery-item skeleton"><div class="skeleton-img"></div></div>
        </div>
    </section>

    <!-- MODAL LIGHTBOX -->
    <div class="modal" id="imgModal" onclick="this.style.display='none'">
        <span class="modal-close">&times;</span>
        <img src="" id="modalImg">
    </div>

    <!-- FOOTER -->
    <footer><p>&copy; 2024 1 Core Interior Design Studio.</p></footer>

    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. KONFIGURASI SUPABASE
        const SUPABASE_URL = 'https://dikapquhusbwjccbqcsb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpa2FwcXVodXNid2pjY2JxY3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNjQ1NTQsImV4cCI6MjA4NDc0MDU1NH0.X278oHDF0be7oa25484eliSukSYAYvDbJyU6ysz83zA';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. FUNGSI LOAD GALLERY
        async function loadGallery() {
            const container = document.getElementById('galleryContainer');
            
            try {
                let { data, error } = await sb
                    .from('1_core_gallery')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p style="color:var(--gray); text-align:center; grid-column: 1/-1;">Tidak ada proyek ditemukan.</p>';
                    return;
                }

                data.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    
                    div.innerHTML = `
                        <img src="${item.image_url}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Error'">
                        <div class="item-info">
                            <span class="item-category">${item.category}</span>
                            <h3 class="item-title">${item.title}</h3>
                        </div>
                    `;

                    div.onclick = () => openModal(item.image_url);

                    container.appendChild(div);

                    setTimeout(() => {
                        div.classList.add('loaded');
                    }, 100 * index);
                });

            } catch (err) {
                console.error('Error loading gallery:', err.message);
                container.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Gagal memuat data. Periksa koneksi atau API Key.</p>`;
            }
        }

        // 3. FUNGSI MODAL
        function openModal(src) {
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = src;
        }

        window.onload = loadGallery;
    </script>
</body>
</html>
